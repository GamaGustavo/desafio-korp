---
- name: Instalar Docker Engine
  hosts: korp_target
  become: yes
  vars:
    # Fallback de segurança: Se o codename não for conhecido pelo repo do Docker, usa 'noble' (24.04)
    docker_ubuntu_release: "{{ ansible_facts['distribution_release'] if ansible_facts['distribution_release'] in ['jammy', 'noble', 'focal'] else 'noble' }}"

  tasks:

    - name: Criar diretório de chaveiros do Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar chave GPG do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar repositório do Docker (formato DEB822)
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ docker_ubuntu_release }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    # 2. Instalação do Docker Engine
    - name: Instalar Docker Engine e Plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Garantir que o serviço Docker esteja em execução e habilitado
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Adicionar usuário ao grupo docker ('Segurança:' evitar executar docker como root)
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes