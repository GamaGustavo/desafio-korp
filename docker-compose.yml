services:
  # Container 1: A aplicação Go
  http-server-projeto-korp:
    build:
      context: ./app-go
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    networks:
      - korp-network
    restart: unless-stopped

  # Container 2: O Nginx (Reverse Proxy)
  nginx:
    image: nginx:1.31.3-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"            
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro 
    networks:
      - korp-network
    depends_on:
      - http-server-projeto-korp
    restart: unless-stopped

networks:
  korp-network:
    driver: bridge      