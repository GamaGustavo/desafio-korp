server {
    listen 80;
    server_name localhost;

    location /projeto-korp {
        proxy_pass http://http-server-projeto-korp:8080/projeto-korp;
        
        # Headers padrão para manter a rastreabilidade da requisição
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback para a raiz (opcional, mas bom para evitar erros 404 feios)
    location / {
        return 404 '{"error": "Rota não encontrada. Tente /projeto-korp"}';
        add_header Content-Type application/json;
    }
}